name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The published artifact is built, not the source tree, so a build
      # failure has to fail here rather than at publish time.
      - run: npm run build

  eslint-versions:
    # The manifest claims eslint >=9, so both majors get exercised.
    name: eslint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint: ['9', '10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: npm test

  corpus:
    # The invariants that matter — semantic preservation, idempotence, width
    # compliance — only bite on real code, so they run against ten
    # third-party repositories rather than fixtures. This is the check that
    # has caught every dangerous bug in this project.
    name: corpus invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # These import src/index.ts directly, so the runtime must strip types.
      - run: node scripts/clone-corpus.js
      - run: node scripts/audit.js
      - run: node scripts/diff-prettier.js
